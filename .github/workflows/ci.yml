name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: make install

      - name: Format code
        run: make format

      - name: Train model
        run: make train

      - name: Evaluate model
        env:
          REPO_TOKEN: ${{ secrets.TOKEN }}
        run: make eval

      - name: Update branch with results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          git config --global user.name "${{ env.USER_NAME }}"
          git config --global user.email "${{ env.USER_EMAIL }}"
          git commit -am "Update with new results" --allow-empty
          git push origin main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: model-results
          path: |
            Results/
            report.md

      - name: Comment PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            try {
              const metrics = fs.readFileSync('./Results/metrics.txt', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 📊 Model Evaluation Results\n\n```\n' + metrics + '\n```'
              });
            } catch (e) {
              console.log('No metrics file found');
            }